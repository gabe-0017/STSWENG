# Staging (Render + Supabase). Every secret comes from Render's environment settings:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
# JWT_SIGNING_KEY, ID_HMAC_SECRET, DEMO_PASSWORD (only if demo data is enabled).
# The frontend is served by this same service, so CORS_ALLOWED_ORIGINS is optional here.
civiccare.demo-data.enabled=${DEMO_DATA_ENABLED:true}

# Render terminates HTTPS in front of the app. Trust its X-Forwarded-* headers so Spring sees
# the real https scheme/host (keeps same-origin POSTs such as login from looking cross-origin).
server.forward-headers-strategy=native
