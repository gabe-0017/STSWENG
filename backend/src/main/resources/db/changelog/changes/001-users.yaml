databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: group05
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: email, type: varchar(254), constraints: { nullable: false, unique: true, uniqueConstraintName: uq_users_email } }
              - column: { name: password_hash, type: varchar(100), constraints: { nullable: false } }
              - column: { name: full_name, type: varchar(200), constraints: { nullable: false } }
              - column: { name: role, type: varchar(30), constraints: { nullable: false } }
              - column: { name: enabled, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: version, type: bigint, constraints: { nullable: false } }
