spring.application.name=seniorchain

# Render (and most hosts) pass the port in $PORT
server.port=${PORT:8080}
server.error.include-stacktrace=never

# Java 21 virtual threads: cheap concurrency for I/O-bound requests
spring.threads.virtual.enabled=true

# Database: set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD in the environment.
# Liquibase owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Errors as RFC 7807 ProblemDetail
spring.mvc.problemdetails.enabled=true

# Paginate every list, never more than 100 rows per page
spring.data.web.pageable.max-page-size=100

# Only expose what Render needs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# API docs at /swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# App settings. Secrets have no default here on purpose: the app refuses to
# start in staging if they are missing. Dev defaults live in application-dev.properties.
seniorchain.jwt.signing-key=${JWT_SIGNING_KEY}
seniorchain.jwt.ttl=${JWT_TTL:1h}
seniorchain.id-hmac.secret=${ID_HMAC_SECRET}
seniorchain.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
seniorchain.id-card.validity-years=5
seniorchain.demo-data.enabled=${DEMO_DATA_ENABLED:false}
seniorchain.demo-data.password=${DEMO_PASSWORD:}
