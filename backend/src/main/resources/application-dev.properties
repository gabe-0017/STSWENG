# Local development: Postgres from docker-compose.yml at the repo root.
# These values are for local use only. Never reuse them in staging.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seniorchain}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:seniorchain}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:seniorchain}

seniorchain.jwt.signing-key=${JWT_SIGNING_KEY:dev-only-jwt-signing-key-change-me-0123456789}
seniorchain.id-hmac.secret=${ID_HMAC_SECRET:dev-only-id-hmac-secret-change-me-0123456789}

# Seed demo accounts (synthetic data) on startup
seniorchain.demo-data.enabled=${DEMO_DATA_ENABLED:true}
seniorchain.demo-data.password=${DEMO_PASSWORD:Demo1234!}
