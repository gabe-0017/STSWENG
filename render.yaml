# Render Blueprint: ONE web service that serves the React site and the API.
# Optional: you can instead enter the same settings by hand in the Render dashboard.
services:
  - type: web
    name: civiccareid
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      # Supabase: use the SESSION POOLER string (Connect > Session pooler), not the direct one.
      # The direct connection is IPv6-only and Render cannot reach it without a paid add-on.
      # JDBC form: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      # Username for the pooler is postgres.<project-ref> (not just "postgres").
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Render generates a long random value for these once; they stay stable after that
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: ID_HMAC_SECRET
        generateValue: true
      - key: DEMO_DATA_ENABLED
        value: "false"
